name: monitor

# Robô mensal: baixa os dados abertos da ANEEL, recalcula o risco do ano corrente e versiona os relatórios.
on:
  schedule:
    - cron: "17 9 5 * *"   # dia 5 de cada mês, 06:17 em Brasília
  workflow_dispatch:
    inputs:
      backtest:
        description: "Refazer também o backtest 2021-2025"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Rodar o robô
        run: |
          if [ "${{ inputs.backtest }}" = "true" ]; then
            python scripts/robo.py --backtest
          else
            python scripts/robo.py
          fi
      - name: Versionar relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports powerbi
          if git diff --cached --quiet; then
            echo "Sem mudanças nos relatórios."
          else
            git commit -m "Atualiza monitor de risco ($(date -u +%Y-%m-%d))"
            git push
          fi
