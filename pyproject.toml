[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrisk"
version = "0.1.0"
description = "Monitor de risco regulatório de continuidade (DEC/FEC) por conjunto, com dados abertos da ANEEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "pyyaml>=6",
  "lightgbm>=4.5",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3"]
app = ["streamlit>=1.39", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
